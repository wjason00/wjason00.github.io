name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Assemble and verify public artifact
        run: node scripts/build-site.mjs
      - name: Install test dependencies
        run: npm ci
      - name: Check data, figures and replay modules
        run: node --test --test-concurrency=1 tests/*.test.* demos/fly/tests/*.test.mjs
      - name: Install Chromium for responsive checks
        run: npx playwright install --with-deps chromium
      - name: Check responsive layout
        env:
          PORTFOLIO_SITE_ROOT: _site
        run: npm run test:layout
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
