<line x1="550" x2="550" y1="458" y2="587" stroke="#e1e6e8"/><text x="550" y="615" text-anchor="middle" class="tick">0.12</text><line x1="80" x2="550" y1="587" y2="587" stroke="#8c9ca7"/>
      <text class="foot" x="24" y="519" text-anchor="middle" transform="rotate(-90 24 519)">Seed</text><text x="62" y="478" text-anchor="end" class="seed-label">0</text><circle data-metric="choice_branch_target_nmse" data-seed="0" data-value="0.09970259245308448" cx="470.50182044124756" cy="471" r="6.5" fill="#376b91"><title>Seed 0: 0.0997</title></circle>
<text x="62" y="502" text-anchor="end" class="seed-label">1</text><circle data-metric="choice_branch_target_nmse" data-seed="1" data-value="0.11217715159262447" cx="519.3605104044459" cy="495" r="6.5" fill="#a05e22"><title>Seed 1: 0.1122</title></circle>
<text x="62" y="526" text-anchor="end" class="seed-label">2</text><circle data-metric="choice_branch_target_nmse" data-seed="2" data-value="0.09537924466424523" cx="453.56870826829385" cy="519" r="6.5" fill="#7461a6"><title>Seed 2: 0.0954</title></circle>
<text x="62" y="550" text-anchor="end" class="seed-label">3</text><circle data-metric="choice_branch_target_nmse" data-seed="3" data-value="0.09999344234591649" cx="471.64098252150626" cy="543" r="6.5" fill="#287c75"><title>Seed 3: 0.1000</title></circle>
<text x="62" y="574" text-anchor="end" class="seed-label">4</text><circle data-metric="choice_branch_target_nmse" data-seed="4" data-value="0.09291302034577775" cx="443.90932968762957" cy="567" r="6.5" fill="#a04d68"><title>Seed 4: 0.0929</title></circle>
      <text class="range" x="28" y="654">Full seed range: 0.0929–0.1122</text>
    </g>
    <text class="foot" x="28" y="687">Separate scales · each point is one noise seed</text>
    <text class="foot" x="28" y="713">Full ranges across seeds; no confidence intervals</text>
  </svg>
